name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # P4: 걸림 방지 (기본 360분 → 30분)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 의존성 설치
        run: pip install -r requirements-dev.txt
      - name: 린트와 포맷
        run: |
          ruff check app tests
          black --check app tests
          isort --check-only app tests
      - name: 테스트와 커버리지
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85 --junitxml=artifacts/junit.xml
        env:
          DATABASE_URL: "sqlite://"
          DEBUG: "true"
          AI_API_KEY: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-integration-results
          path: artifacts/junit.xml

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # P4: 걸림 방지 (chromium 다운로드 포함 상한)
    steps:
      - uses: actions/checkout@v4
      - name: 프론트 JS 난독화 빌드 도구 의존성
        run: npm ci --prefix tools/js-build
      - name: 난독화 빌드(산출물) + 문법·계약 검증
        run: |
          npm run --prefix tools/js-build build:js -- --in "$GITHUB_WORKSPACE/static/js" --out "$GITHUB_WORKSPACE/artifacts/js"
          for f in artifacts/js/*.js; do node --check "$f" && echo "✅ 문법 OK: $f"; done
          # 전역 계약 보존 검증 — 난독화 후에도 form-utils.js가 FormUtils를 런타임에 공개해야 한다
          # (식별자가 base64 문자열 배열로 이동해도 런타임 계약만 정확하면 통과)
          node -e "require('$GITHUB_WORKSPACE/artifacts/js/form-utils.js'); if (typeof globalThis.FormUtils?.codepointLength !== 'function') { console.error('❌ FormUtils 전역 계약이 사라졌다'); process.exit(1); }"
          echo "✅ FormUtils 전역 계약 유지 (런타임 검증)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obfuscated-js
          path: artifacts/js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 로컬 브라우저 검증 의존성
        run: |
          pip install -r requirements-evidence.txt
          python -m playwright install --with-deps chromium
      - name: 실제 로컬 앱의 브라우저 검증 (운영·실 AI 아님)
        run: python scripts/capture_local_evidence.py --output artifacts/local-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-ui-evidence
          path: artifacts/local-ui
