# CD — main 병합 시 Railway 자동 배포 + E2E 스모크
#
# 흐름: 테스트 게이트(ruff+pytest) → Secrets→Railway 변수 동기화 → railway up
#       → /health 폴링 → e2e_smoke.sh
# 상세 절차: docs/RAILWAY_DEPLOY.md
#
# 필수 Secrets (Settings → Secrets and variables → Actions):
#   RAILWAY_TOKEN  : Railway project token (CLI 인증)
#   DEPLOY_URL     : 공개 URL (스모크 대상, 예: https://xxx.up.railway.app)
#   SESSION_SECRET : 세션 서명 키 (32자 이상 — dev 기본값 금지)
# 선택 Secrets (없으면 코드 기본값 사용):
#   AI_API_KEY                 : 없으면 데모 모드로 배포 (경고 출력)
#   AI_BASE_URL / AI_MODEL / AI_TIMEOUT_SEC / AI_MAX_RETRIES / CONTEXT_TURNS
#   DATABASE_URL               : 기본 sqlite:////data/app.db (Railway Volume 경로)
#   CHAT_RATE_PER_MIN          : 기본 10 (사용자별 분당 채팅 상한, 0=비활성) (#73)
#   LOGIN_MAX_FAILS / LOGIN_LOCKOUT_SEC : 기본 5 / 900 (로그인 실패 잠금) (#72)
#   SESSION_MAX_AGE_HOURS      : 기본 24 (세션 쿠키 수명) (#74)
#   DOCS_ENABLED               : 기본 false — 운영에서 /docs·/redoc·/openapi.json 비활성 (#75)
#   SMTP_HOST/PORT/USER/PASSWORD/FROM : 비밀번호 재설정 메일. 없으면 운영 503(개발은 로그 출력)
#   PASSWORD_RESET_EXPIRY_MINUTES/MAX_REQUESTS/WINDOW_MINUTES : 재설정 토큰 정책
# 선택 Variables: RAILWAY_SERVICE_NAME (기본 ai-chatbot-service),
#                 RAILWAY_ENVIRONMENT (기본 production)

name: CD (Railway Deploy & Smoke)

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # 수동 재배포

concurrency:
  group: production-deploy
  cancel-in-progress: false  # 배포 중 overlapping 방지 (순서대로 실행)

jobs:
  gate:
    name: 배포 게이트 (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: 린트 (ruff)
        run: ruff check app tests

      - name: 테스트 (pytest)
        run: pytest -q
        env:
          DATABASE_URL: "sqlite://"

  deploy:
    name: Railway 배포 + 스모크
    runs-on: ubuntu-latest
    needs: gate
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 필수 Secrets 검증
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          fail=0
          [ -n "$RAILWAY_TOKEN" ] || { echo "❌ RAILWAY_TOKEN 미설정"; fail=1; }
          [ -n "$DEPLOY_URL" ] || { echo "❌ DEPLOY_URL 미설정"; fail=1; }
          if [ -z "$SESSION_SECRET" ]; then echo "❌ SESSION_SECRET 미설정"; fail=1;
          elif [ "${#SESSION_SECRET}" -lt 32 ]; then echo "❌ SESSION_SECRET 32자 이상 필요"; fail=1; fi
          # 시크릿 값은 절대 출력하지 않음 (유무·길이만 검사 — 값은 마스킹됨)
          [ "$fail" = 0 ] || exit 1
          echo "✅ 필수 Secrets 확인"

      - name: Railway CLI 설치
        run: npm install -g @railway/cli

      - name: Secrets → Railway 변수 동기화
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_TIMEOUT_SEC: ${{ secrets.AI_TIMEOUT_SEC }}
          AI_MAX_RETRIES: ${{ secrets.AI_MAX_RETRIES }}
          CONTEXT_TURNS: ${{ secrets.CONTEXT_TURNS }}
          MAX_QUESTION_LENGTH: ${{ secrets.MAX_QUESTION_LENGTH }}
          CHAT_RATE_PER_MIN: ${{ secrets.CHAT_RATE_PER_MIN }}
          LOGIN_MAX_FAILS: ${{ secrets.LOGIN_MAX_FAILS }}
          LOGIN_LOCKOUT_SEC: ${{ secrets.LOGIN_LOCKOUT_SEC }}
          SESSION_MAX_AGE_HOURS: ${{ secrets.SESSION_MAX_AGE_HOURS }}
          DOCS_ENABLED: ${{ secrets.DOCS_ENABLED }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          PASSWORD_RESET_EXPIRY_MINUTES: ${{ secrets.PASSWORD_RESET_EXPIRY_MINUTES }}
          PASSWORD_RESET_MAX_REQUESTS: ${{ secrets.PASSWORD_RESET_MAX_REQUESTS }}
          PASSWORD_RESET_WINDOW_MINUTES: ${{ secrets.PASSWORD_RESET_WINDOW_MINUTES }}
          SERVICE: ${{ vars.RAILWAY_SERVICE_NAME }}
          RAIL_ENV: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: |
          SERVICE="${SERVICE:-ai-chatbot-service}"
          RAIL_ENV="${RAIL_ENV:-production}"
          set_var() { # 미설정은 명시적 기본값/빈 값으로 동기화(이전 값 유지 아님)
            railway variable set "$1=${2:-$3}" --service "$SERVICE" \
              --environment "$RAIL_ENV" --skip-deploys
            echo "  · $1: 동기화 완료"
          }
          echo "🔄 GitHub Secrets → Railway 변수 (source of truth: Secrets)"
          set_var AI_API_KEY "$AI_API_KEY" ""
          [ -n "$AI_API_KEY" ] || echo "  ⚠️ AI_API_KEY 없음 → 빈 값으로 동기화하며 데모 모드로 배포합니다"
          set_var AI_BASE_URL "$AI_BASE_URL" "https://api.openai.com/v1/chat/completions"
          set_var AI_MODEL "$AI_MODEL" "gpt-4o-mini"
          set_var AI_TIMEOUT_SEC "$AI_TIMEOUT_SEC" "45"
          set_var AI_MAX_RETRIES "$AI_MAX_RETRIES" "1"
          set_var CONTEXT_TURNS "$CONTEXT_TURNS" "5"
          set_var MAX_QUESTION_LENGTH "$MAX_QUESTION_LENGTH" "1000"
          set_var CHAT_RATE_PER_MIN "$CHAT_RATE_PER_MIN" "10"
          set_var LOGIN_MAX_FAILS "$LOGIN_MAX_FAILS" "5"
          set_var LOGIN_LOCKOUT_SEC "$LOGIN_LOCKOUT_SEC" "900"
          set_var SESSION_MAX_AGE_HOURS "$SESSION_MAX_AGE_HOURS" "24"
          set_var DOCS_ENABLED "$DOCS_ENABLED" "false"
          set_var DEBUG "false" "false"
          set_var SESSION_SECRET "$SESSION_SECRET" ""
          set_var DATABASE_URL "$DATABASE_URL" "sqlite:////data/app.db"
          set_var SMTP_HOST "$SMTP_HOST" ""
          set_var SMTP_PORT "$SMTP_PORT" "587"
          set_var SMTP_USER "$SMTP_USER" ""
          set_var SMTP_PASSWORD "$SMTP_PASSWORD" ""
          set_var SMTP_FROM "$SMTP_FROM" "AI Chatbot Service <no-reply@example.com>"
          set_var PASSWORD_RESET_EXPIRY_MINUTES "$PASSWORD_RESET_EXPIRY_MINUTES" "30"
          set_var PASSWORD_RESET_MAX_REQUESTS "$PASSWORD_RESET_MAX_REQUESTS" "3"
          set_var PASSWORD_RESET_WINDOW_MINUTES "$PASSWORD_RESET_WINDOW_MINUTES" "15"

      - name: 배포 (railway up)
        env:
          SERVICE: ${{ vars.RAILWAY_SERVICE_NAME }}
          RAIL_ENV: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: |
          SERVICE="${SERVICE:-ai-chatbot-service}"
          RAIL_ENV="${RAIL_ENV:-production}"
          railway up --detach --service "$SERVICE" --environment "$RAIL_ENV"

      - name: /health 폴링 (최대 5분)
        env:
          URL: ${{ secrets.DEPLOY_URL }}
        run: |
          for i in $(seq 1 60); do
            if curl -sf "$URL/health" > /dev/null; then echo "✅ 헬스체크 통과"; exit 0; fi
            sleep 5
          done
          echo "❌ 5분 내 헬스체크 실패"; exit 1

      - name: E2E 스모크 테스트
        env:
          URL: ${{ secrets.DEPLOY_URL }}
        run: |
          chmod +x scripts/e2e_smoke.sh
          ./scripts/e2e_smoke.sh "$URL"
