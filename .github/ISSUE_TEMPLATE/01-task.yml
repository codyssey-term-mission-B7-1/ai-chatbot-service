name: 🛠 작업 이슈
description: 역할 카드 하위의 기능/작업 단위 이슈 (스프린트 진행용)
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        > 브랜치는 `feature/#이슈번호-설명` 형태로 생성하세요.
        > 커밋 메시지는 `type(scope): 제목 (#이슈번호)` 컨벤션을 지킵니다.

  - type: textarea
    id: what
    attributes:
      label: 작업 내용
      description: 무엇을 만들지/고칠지 + 왜 필요한지
      placeholder: |
        예) POST /api/chat에 컨텍스트 기능 추가 — 직전 5개 Q/A를 AI 프롬프트에 포함
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 담당 영역
      options:
        - 서버 (FastAPI · 인증)
        - AI · DB 파이프라인
        - 프론트엔드
        - 운영 · 배포
        - 문서 · 테스트
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건 (Definition of Done)
      description: 머지 조건입니다. 테스트/문서를 포함해 적어주세요.
      placeholder: |
        예) pytest 통과 + README 파이프라인 섹션 업데이트
    validations:
      required: true

  - type: input
    id: schedule
    attributes:
      label: 목표 완료일 (일정표 Day 기준)
      placeholder: 예) D7 (2주차 수요일)
