{% extends "base.html" %}
{% block title %}비밀번호 찾기{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>🔑 비밀번호 찾기</h1>
  <p class="muted">가입한 이메일을 입력하면 재설정 링크를 보내드려요.</p>
  {% if not smtp_ready %}
  <p class="msg error" role="alert">메일 발송(SMTP)이 아직 설정되지 않았어요. 운영자에게 문의해 주세요.</p>
  {% endif %}
  <form id="forgot-form" data-mode="forgot">
    <label>이메일
      <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
    </label>
    <button type="submit" id="submit-btn">재설정 메일 보내기</button>
  </form>
  <p id="msg" class="msg" role="alert" hidden></p>
  <p class="muted small"><a href="/login">← 로그인으로 돌아가기</a></p>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/password-reset.js"></script>{% endblock %}
