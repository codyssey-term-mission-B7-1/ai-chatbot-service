<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}AI 챗봇{% endblock %} · AI Chatbot Service</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ asset_v }}">
  <script src="/static/js/theme-init.js?v={{ asset_v }}"></script>
  <link rel="stylesheet" href="/static/css/style.css?v={{ asset_v }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <nav class="nav">
    <div class="nav-left">
      {% block menu_toggle %}{% endblock %}
      <a class="brand" href="/">🤖 AI 챗봇</a>
    </div>
    <div class="nav-right">
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="테마 전환"></button>
      {% if nickname %}
        <span class="user-chip">{{ nickname }}님</span>
        <a class="nav-link" href="/logs">내 기록</a>
        {% if is_admin %}<a class="nav-link" href="/admin/logs">관리자 조회</a>{% endif %}
        <button class="nav-link linklike" id="logout-btn" type="button">로그아웃</button>
      {% else %}
        <a class="nav-link" href="/login">로그인</a>
        <a class="nav-link primary" href="/signup">회원가입</a>
      {% endif %}
    </div>
  </nav>
  <div class="page-shell{% block page_class %}{% endblock %}">
    {% block sidebar %}{% endblock %}
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/js/theme.js?v={{ asset_v }}"></script>
  <script src="/static/js/form-utils.js?v={{ asset_v }}"></script>
  <script src="/static/js/logout.js?v={{ asset_v }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
